pre-commit:
  piped: true
  jobs:
    - name: format
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    - name: api-structure
      glob: "apps/api/src/**"
      run: zsh scripts/check-api-structure.sh

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
